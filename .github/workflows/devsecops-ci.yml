name: DevSecOps CI

on:
  pull_request:
    branches: [ yassin-branch ]
  push:
    branches: [ yassin-branch ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # weekly Monday run

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  php-sast:
    name: PHP SAST (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
          extensions: mongodb-1.20.0, mbstring, intl, gd, zip, bcmath, exif, fileinfo, dom, pdo, pdo_mysql

      - name: Install system packages (intl/gd prerequisites)
        run: sudo apt-get update && sudo apt-get install -y libicu-dev libzip-dev libjpeg-dev libpng-dev libonig-dev

      - name: Cache Composer (root)
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-root-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-root-${{ runner.os }}-

      - name: Cache Composer (laravel app)
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            AdminPanelFastServiceTravel/vendor
          key: composer-app-${{ runner.os }}-${{ hashFiles('AdminPanelFastServiceTravel/composer.lock') }}
          restore-keys: composer-app-${{ runner.os }}-

      - name: Install PHP dependencies (Laravel app)
        working-directory: AdminPanelFastServiceTravel
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-mongodb || composer install --no-interaction --no-progress --prefer-dist

      - name: PHPStan (SARIF)
        run: |
          set -e
          AdminPanelFastServiceTravel/vendor/bin/phpstan analyse -c phpstan.neon --no-progress --error-format=sarif > phpstan.sarif || echo "PHPStan failed"
          if ! grep -q '"version"' phpstan.sarif 2>/dev/null; then echo "Invalid or empty SARIF, removing"; rm -f phpstan.sarif; fi

      - name: Upload SARIF
        if: always() && hashFiles('phpstan.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: phpstan.sarif
      - name: Upload artifact (PHPStan SARIF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpstan-sarif
          path: phpstan.sarif
          if-no-files-found: ignore

  psalm-sast:
    name: PHP SAST (Psalm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
          extensions: mongodb-1.20.0, mbstring, intl, gd, zip, exif, fileinfo, dom, pdo, pdo_mysql, bcmath

      - name: Install system packages (intl/gd prerequisites)
        run: sudo apt-get update && sudo apt-get install -y libicu-dev libzip-dev libjpeg-dev libpng-dev libonig-dev

      - name: Cache Composer (laravel app)
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            AdminPanelFastServiceTravel/vendor
          key: composer-app-${{ runner.os }}-${{ hashFiles('AdminPanelFastServiceTravel/composer.lock') }}
          restore-keys: composer-app-${{ runner.os }}-

      - name: Install PHP dependencies (Laravel app)
        working-directory: AdminPanelFastServiceTravel
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-mongodb || composer install --no-interaction --no-progress --prefer-dist

      - name: Psalm
        run: AdminPanelFastServiceTravel/vendor/bin/psalm --no-cache -c AdminPanelFastServiceTravel/psalm.xml
        continue-on-error: true

  composer-audit:
    name: Composer Audit (Vulns)
    runs-on: ubuntu-latest
    needs: [php-sast, psalm-sast, eslint]
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mongodb-1.20.0, mbstring, intl, gd, zip, exif, fileinfo, dom, pdo, pdo_mysql, bcmath

      - name: Install system packages (intl/gd prerequisites)
        run: sudo apt-get update && sudo apt-get install -y libicu-dev libzip-dev libjpeg-dev libpng-dev libonig-dev
      - name: Install deps (Laravel app)
        working-directory: AdminPanelFastServiceTravel
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-mongodb || composer install --no-interaction --no-progress --prefer-dist
      - name: Audit
        run: composer audit -d AdminPanelFastServiceTravel --no-interaction --locked
        continue-on-error: true

  pint:
    name: Laravel Pint (Style)
    runs-on: ubuntu-latest
    needs: [php-sast]
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mongodb-1.20.0, mbstring, intl, gd, zip, exif, fileinfo, dom, pdo, pdo_mysql, bcmath

      - name: Install system packages (intl/gd prerequisites)
        run: sudo apt-get update && sudo apt-get install -y libicu-dev libzip-dev libjpeg-dev libpng-dev libonig-dev
      - name: Install deps (Laravel app)
        working-directory: AdminPanelFastServiceTravel
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-mongodb || composer install --no-interaction --no-progress --prefer-dist
      - name: Pint check
        run: AdminPanelFastServiceTravel/vendor/bin/pint --test
        continue-on-error: true

  eslint:
    name: ESLint (React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: travelAgency/package-lock.json
      - name: Install deps (with lockfile)
        if: ${{ hashFiles('travelAgency/package-lock.json') != '' }}
        working-directory: travelAgency
        run: npm ci --legacy-peer-deps
      - name: Install deps (no lockfile)
        if: ${{ hashFiles('travelAgency/package-lock.json') == '' }}
        working-directory: travelAgency
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Lint
        working-directory: travelAgency
        run: npx eslint 'src/**/*.{js,jsx}'
        continue-on-error: true

  npm-audit:
    name: NPM Audit (React)
    runs-on: ubuntu-latest
    needs: [eslint]
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: travelAgency/package-lock.json
      - name: Install deps (with lockfile)
        if: ${{ hashFiles('travelAgency/package-lock.json') != '' }}
        working-directory: travelAgency
        run: npm install --omit=dev --legacy-peer-deps --no-audit --no-fund
      - name: Install deps (no lockfile)
        if: ${{ hashFiles('travelAgency/package-lock.json') == '' }}
        working-directory: travelAgency
        run: npm install --omit=dev --legacy-peer-deps --no-audit --no-fund
      - name: Audit (prod deps, critical only)
        working-directory: travelAgency
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true

  trivy-fs:
    name: Trivy FS Scan (Vulns)
    runs-on: ubuntu-latest
    needs: [php-sast, psalm-sast, eslint]
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-fs.sarif
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '1'
        continue-on-error: true
      - name: Upload SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
      - name: Upload artifact (Trivy FS SARIF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-sarif
          path: trivy-fs.sarif
          if-no-files-found: ignore

  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    needs: [php-sast, psalm-sast, eslint]
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    needs: [php-sast, psalm-sast, eslint]
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python (semgrep runtime)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run Semgrep OSS rules
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/owasp-top-ten
          generateSarif: true
          sarif: semgrep.sarif
          strict: false
        continue-on-error: true
      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
      - name: Upload artifact (Semgrep SARIF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore

  docker-image-scan:
    name: Docker Image Build + Scan
    runs-on: ubuntu-latest
    needs: [eslint]
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        run: docker build -f ./.ci/front.dockerfile -t app-frontend:ci .

      - name: Build backend image
        run: docker build -f ./.ci/back.dockerfile --build-arg WWWGROUP=20 -t app-backend:ci .

      - name: Trivy scan (frontend image)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: app-frontend:ci
          format: sarif
          output: trivy-frontend.sarif
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '1'
        continue-on-error: true

      - name: Upload SARIF (frontend)
        if: always() && hashFiles('trivy-frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
      - name: Upload artifact (Trivy frontend SARIF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-sarif
          path: trivy-frontend.sarif
          if-no-files-found: ignore

      - name: Trivy scan (backend image)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: app-backend:ci
          format: sarif
          output: trivy-backend.sarif
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '1'
        continue-on-error: true

      - name: Upload SARIF (backend)
        if: always() && hashFiles('trivy-backend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
      - name: Upload artifact (Trivy backend SARIF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-sarif
          path: trivy-backend.sarif
          if-no-files-found: ignore

  demo-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - php-sast
      - psalm-sast
      - composer-audit
      - pint
      - eslint
      - npm-audit
      - trivy-fs
      - gitleaks
      - semgrep
      - docker-image-scan
    steps:
      - name: Write summary
        run: |
          {
            echo "## DevSecOps CI Summary";
            echo "";
            echo "Triggered by: ${{ github.event_name }} on ref ${{ github.ref_name }}";
            echo "";
            echo "| Job | Result |";
            echo "|---|---|";
            echo "| PHP SAST (PHPStan) | ${{ needs.php-sast.result }} |";
            echo "| PHP SAST (Psalm) | ${{ needs.psalm-sast.result }} |";
            echo "| Composer Audit | ${{ needs.composer-audit.result }} |";
            echo "| Laravel Pint | ${{ needs.pint.result }} |";
            echo "| ESLint (React) | ${{ needs.eslint.result }} |";
            echo "| NPM Audit | ${{ needs.npm-audit.result }} |";
            echo "| Trivy FS | ${{ needs.trivy-fs.result }} |";
            echo "| Gitleaks | ${{ needs.gitleaks.result }} |";
            echo "| Semgrep | ${{ needs.semgrep.result }} |";
            echo "| Docker Image Build + Scan | ${{ needs.docker-image-scan.result }} |";
            echo "";
            echo "Artifacts (download from this run):";
            echo "- phpstan-sarif";
            echo "- trivy-fs-sarif";
            echo "- semgrep-sarif";
            echo "- trivy-frontend-sarif";
            echo "- trivy-backend-sarif";
          } >> $GITHUB_STEP_SUMMARY
