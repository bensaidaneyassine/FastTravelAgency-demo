name: Configure Branch Protection

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to protect'
        required: true
        default: 'yassin-branch'

permissions:
  contents: read
  pull-requests: write

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Update branch protection
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_ADMIN_TOKEN }}
          script: |
            const branch = core.getInput('branch');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Use contexts (array of strings) – required by REST API
            const required_status_checks = {
              strict: true,
              contexts: [
                'DevSecOps CI / php-sast',
                'DevSecOps CI / psalm-sast',
                'DevSecOps CI / composer-audit',
                'DevSecOps CI / pint',
                'DevSecOps CI / eslint',
                'DevSecOps CI / npm-audit',
                'DevSecOps CI / trivy-fs',
                'DevSecOps CI / gitleaks',
                'DevSecOps CI / semgrep'
                // Add CodeQL contexts here only if corresponding workflows exist:
                // 'CodeQL (JS/TS) / Analyze',
                // 'CodeQL (PHP) / Analyze'
              ]
            };

            await github.rest.repos.updateBranchProtection({
              owner,
              repo,
              branch,
              required_status_checks,
              enforce_admins: true,
              required_pull_request_reviews: {
                required_approving_review_count: 1,
                dismiss_stale_reviews: true,
                require_code_owner_reviews: false,
                require_last_push_approval: false
              },
              restrictions: null,
              required_linear_history: true,
              allow_force_pushes: false,
              allow_deletions: false,
              block_creations: false,
              required_conversation_resolution: true,
              lock_branch: false,
              allow_fork_syncing: false
            });
            core.info(`Branch protection updated for ${branch}`);