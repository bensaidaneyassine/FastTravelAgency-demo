name: PHP SAST (PHPStan & Psalm)

on:
  push:
    branches: [ yassin-branch ]
  pull_request:
    branches: [ yassin-branch ]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  php-sast:
    name: PHP Static Analysis & Security Reports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
          extensions: mongodb-1.20.0, mbstring, intl, gd, zip, bcmath, exif, fileinfo, dom, pdo, pdo_mysql

      - name: Install system packages (intl/gd prerequisites)
        run: sudo apt-get update && sudo apt-get install -y libicu-dev libzip-dev libjpeg-dev libpng-dev libonig-dev

      - name: Install dependencies (Laravel app)
        run: COMPOSER_MEMORY_LIMIT=-1 composer install -d AdminPanelFastServiceTravel --no-interaction --no-progress --prefer-dist

      - name: PHPStan (SARIF)
        run: AdminPanelFastServiceTravel/vendor/bin/phpstan analyse -c phpstan.neon --no-progress --error-format=sarif > phpstan.sarif || true

      - name: Upload PHPStan SARIF
        if: always() && hashFiles('phpstan.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: phpstan.sarif

      - name: Psalm (SARIF)
        run: AdminPanelFastServiceTravel/vendor/bin/psalm --no-cache --output-format=sarif --report=psalm.sarif || true

      - name: Upload Psalm SARIF
        if: always() && hashFiles('psalm.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: psalm.sarif

      - name: Summary table
        run: |
          {
            echo "## PHP SAST Summary";
            echo "| Tool | SARIF Generated |";
            echo "|------|------------------|";
            if [ -f phpstan.sarif ]; then echo "| PHPStan | yes |"; else echo "| PHPStan | no |"; fi;
            if [ -f psalm.sarif ]; then echo "| Psalm | yes |"; else echo "| Psalm | no |"; fi;
          } >> $GITHUB_STEP_SUMMARY