name: myCI
on:

  pull_request:
    branches: [ yassin-branch ]
  push:
    branches: [ yassin-branch, demo/ci-fix, demo/ci-fix-frontend-fix ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # weekly Monday run

permissions:
  actions: read
  contents: read
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: '${{ github.repository_owner }}/fast-travel-backend'

jobs:
  sast_scan:
    name: Run PHPStan Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
          extensions: mongodb-1.20.0, mbstring, intl, gd, zip, bcmath, exif, fileinfo, dom, pdo, pdo_mysql

      - name: Debug repo layout
        run: |
          echo "PWD: $(pwd)";
          echo "Root listing:"; ls -la
          echo "Check AdminPanelFastServiceTravel exists:"; ls -la AdminPanelFastServiceTravel || true
          echo "Check for composer.json in AdminPanelFastServiceTravel:"; ls -la AdminPanelFastServiceTravel/composer.json || true

      - name: Install PHP dependencies
        working-directory: AdminPanelFastServiceTravel
        run: |
          composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-mongodb || composer install --no-interaction --no-progress --prefer-dist

      - name: Ensure PHPStan is available
        working-directory: AdminPanelFastServiceTravel
        run: |
          if [ ! -f vendor/bin/phpstan ]; then
            echo "PHPStan not found in vendor; installing as dev dependency"
            composer require --dev phpstan/phpstan --no-interaction --no-progress || true
          fi
          echo "PHPStan binary (if present):"; ls -la vendor/bin/phpstan || true
          echo "PHPStan version (if available):"; vendor/bin/phpstan --version || true

      - id: run_phpstan
        name: Run PHPStan (SARIF or JSON fallback)
        working-directory: AdminPanelFastServiceTravel
        run: |
          set -e
          # Prefer SARIF if supported, otherwise produce JSON fallback
          if vendor/bin/phpstan --help 2>/dev/null | grep -qi sarif; then
            echo "PHPStan supports SARIF; producing phpstan.sarif"
            vendor/bin/phpstan analyse -c phpstan.neon --no-progress --error-format=sarif > ../phpstan.sarif || true
          else
            echo "SARIF not supported by this PHPStan version; producing phpstan.json instead"
            vendor/bin/phpstan analyse -c phpstan.neon --no-progress --error-format=json > ../phpstan.json || true
          fi

          # Sanity-check and set outputs for conditional uploads
          if [ -f ../phpstan.sarif ] && grep -q '"version"' ../phpstan.sarif; then
            echo "phpstan.sarif looks valid"
            echo "sarif_exists=true" >> $GITHUB_OUTPUT
            echo "json_exists=false" >> $GITHUB_OUTPUT
          else
            rm -f ../phpstan.sarif || true
            if [ -f ../phpstan.json ] && [ -s ../phpstan.json ]; then
              echo "phpstan.json produced"
              echo "sarif_exists=false" >> $GITHUB_OUTPUT
              echo "json_exists=true" >> $GITHUB_OUTPUT
            else
              echo "No phpstan output produced"
              echo "sarif_exists=false" >> $GITHUB_OUTPUT
              echo "json_exists=false" >> $GITHUB_OUTPUT
            fi
          fi


      - name: Inspect phpstan outputs
        run: |
          echo "DEBUG: step outputs:";
          echo "sarif_exists=${{ steps.run_phpstan.outputs.sarif_exists }}" || true;
          echo "json_exists=${{ steps.run_phpstan.outputs.json_exists }}" || true;
          echo "Listing workspace root:"; ls -la || true
          echo "Listing possible files:"; ls -la phpstan.* || true
          echo "Head of phpstan.json (if present):"; head -n 40 phpstan.json || true

      - id: convert_phpstan
        name: Convert phpstan.json → phpstan.sarif (if needed)
        if: always() && steps.run_phpstan.outputs.json_exists == 'true'
        run: |
          python3 .github/scripts/phpstan_json_to_sarif.py phpstan.json phpstan.sarif || true
          if [ -f phpstan.sarif ] && grep -q '"version"' phpstan.sarif; then
            echo "converted=true" >> $GITHUB_OUTPUT
          else
            echo "converted=false" >> $GITHUB_OUTPUT
          fi
          echo "--- head of converted phpstan.sarif (for debug) ---" || true
          head -n 60 phpstan.sarif || true

      - name: Upload PHPStan SARIF to Code Scanning
        if: always() && (steps.run_phpstan.outputs.sarif_exists == 'true' || (steps.run_phpstan.outputs.json_exists == 'true' && steps.convert_phpstan.outputs.converted == 'true'))
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: phpstan.sarif

      - name: Upload artifact (PHPStan SARIF)
        if: always() && (steps.run_phpstan.outputs.sarif_exists == 'true' || (steps.run_phpstan.outputs.json_exists == 'true' && steps.convert_phpstan.outputs.converted == 'true'))
        uses: actions/upload-artifact@v4
        with:
          name: phpstan-sarif
          path: phpstan.sarif
          if-no-files-found: ignore

      - name: Upload artifact (PHPStan JSON fallback)
        if: always() && steps.run_phpstan.outputs.json_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phpstan-json
          path: phpstan.json
          if-no-files-found: ignore

  psalm-sast:
    name: PHP SAST (Psalm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
          extensions: mongodb-1.20.0, mbstring, intl, gd, zip, exif, fileinfo, dom, pdo, pdo_mysql, bcmath

      - name: Install system packages (intl/gd prerequisites)
        run: sudo apt-get update && sudo apt-get install -y libicu-dev libzip-dev libjpeg-dev libpng-dev libonig-dev

      - name: Cache Composer (laravel app)
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            AdminPanelFastServiceTravel/vendor
          key: composer-app-${{ runner.os }}-${{ hashFiles('AdminPanelFastServiceTravel/composer.lock') }}
          restore-keys: composer-app-${{ runner.os }}-

      - name: Install PHP dependencies (Laravel app)
        working-directory: AdminPanelFastServiceTravel
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req=ext-mongodb || composer install --no-interaction --no-progress --prefer-dist

      - name: Psalm
        run: AdminPanelFastServiceTravel/vendor/bin/psalm --no-cache -c AdminPanelFastServiceTravel/psalm.xml
        continue-on-error: true

  eslint:
    name: ESLint (React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: travelAgency/package-lock.json
      - name: Install deps (with lockfile)
        if: ${{ hashFiles('travelAgency/package-lock.json') != '' }}
        working-directory: travelAgency
        run: npm ci --legacy-peer-deps
      - name: Install deps (no lockfile)
        if: ${{ hashFiles('travelAgency/package-lock.json') == '' }}
        working-directory: travelAgency
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Lint
        working-directory: travelAgency
        run: npx eslint 'src/**/*.{js,jsx}'
        continue-on-error: true

  npm-audit:
    name: NPM Audit (React)
    runs-on: ubuntu-latest
    needs: [eslint]
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: travelAgency/package-lock.json
      - name: Install deps (with lockfile)
        if: ${{ hashFiles('travelAgency/package-lock.json') != '' }}
        working-directory: travelAgency
        run: npm install --omit=dev --legacy-peer-deps --no-audit --no-fund
      - name: Install deps (no lockfile)
        if: ${{ hashFiles('travelAgency/package-lock.json') == '' }}
        working-directory: travelAgency
        run: npm install --omit=dev --legacy-peer-deps --no-audit --no-fund
      - name: Audit (prod deps, critical only)
        working-directory: travelAgency
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true

  trivy-fs:
    name: Trivy FS Scan (Vulns)
    runs-on: ubuntu-latest
    needs: [sast_scan, psalm-sast, eslint]
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-fs.sarif
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '1'
        continue-on-error: true
      - name: Upload SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
      - name: Upload artifact (Trivy FS SARIF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-sarif
          path: trivy-fs.sarif
          if-no-files-found: ignore
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    needs: [sast_scan, psalm-sast, eslint]
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    needs: [sast_scan, psalm-sast, eslint]
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python (semgrep runtime)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run Semgrep OSS rules
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/owasp-top-ten
          generateSarif: true
          sarif: semgrep.sarif
          strict: false
        continue-on-error: true
      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
      - name: Upload artifact (Semgrep SARIF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore

          
  docker-image-scan:
    name: Docker Image Build + Scan
    runs-on: ubuntu-latest
    needs: [eslint]
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build frontend image
        run: docker build -f ./.ci/front.dockerfile -t app-frontend:ci .

      - name: Build backend image
        run: docker build -f ./.ci/back.dockerfile --build-arg WWWGROUP=20 -t app-backend:ci .

      - name: Trivy scan (frontend image)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: app-frontend:ci
          format: sarif
          output: trivy-frontend.sarif
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '1'
        continue-on-error: true

      - name: Upload SARIF (frontend)
        if: always() && hashFiles('trivy-frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend
      - name: Upload artifact (Trivy frontend SARIF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-sarif
          path: trivy-frontend.sarif
          if-no-files-found: ignore

      - name: Trivy scan (backend image)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: app-backend:ci
          format: sarif
          output: trivy-backend.sarif
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '1'
        continue-on-error: true

      - name: Upload SARIF (backend)
        if: always() && hashFiles('trivy-backend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend
      - name: Upload artifact (Trivy backend SARIF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-sarif
          path: trivy-backend.sarif
          if-no-files-found: ignore

  demo-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - sast_scan
      - psalm-sast
      - eslint
      - npm-audit
      - trivy-fs
      - gitleaks
      - semgrep
      - docker-image-scan
    steps:
      - name: Write summary
        run: |
          {
            echo "## DevSecOps CI Summary";
            echo "";
            echo "Triggered by: ${{ github.event_name }} on ref ${{ github.ref_name }}";
            echo "";
            echo "| Job | Result |";
            echo "|---|---|";
            echo "| Job | Result |";
            echo "|---|---|";
            echo "| PHP SAST (PHPStan) | ${{ needs.sast_scan.result }} |";
            echo "| PHP SAST (Psalm) | ${{ needs.psalm-sast.result }} |";
            echo "| ESLint (React) | ${{ needs.eslint.result }} |";
            echo "| Gitleaks | ${{ needs.gitleaks.result }} |";
            echo "| Semgrep | ${{ needs.semgrep.result }} |";
            echo "| Docker Image Build + Scan | ${{ needs.docker-image-scan.result }} |";
            echo "";
            echo "Artifacts (download from this run):";
            echo "- phpstan-sarif";
            echo "- trivy-fs-sarif";
            echo "- semgrep-sarif";
            echo "- trivy-frontend-sarif";
            echo "- trivy-backend-sarif";
          } >> $GITHUB_STEP_SUMMARY
  build-and-push-image:
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      #
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      # Uses the `docker/login-action` action to log in to the Container registry registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # This step uses [docker/metadata-action](https://github.com/docker/metadata-action#about) to extract tags and labels that will be applied to the specified image. The `id` "meta" allows the output of this step to be referenced in a subsequent step. The `images` value provides the base name for the tags and labels.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      # This step uses the `docker/build-push-action` action to build the image, based on your repository's `Dockerfile`. If the build succeeds, it pushes the image to GitHub Packages.
      # It uses the `context` parameter to define the build's context as the set of files located in the specified path. For more information, see [Usage](https://github.com/docker/build-push-action#usage) in the README of the `docker/build-push-action` repository.
      # It uses the `tags` and `labels` parameters to tag and label the image with the output from the "meta" step.
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          file: ./.ci/front.dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      
      # This step generates an artifact attestation for the image, which is an unforgeable statement about where and how it was built. It increases supply chain security for people who consume the image. For more information, see [Using artifact attestations to establish provenance for builds](/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds).
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      


