server {
    listen 80;
    server_name _;
    # Development: disable forced HTTPS redirect so API stays on http://localhost
    # Serve React front directly via reverse proxy and Laravel API under /api
    root /var/www/html/public;
    index index.php;

    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass nginx-docker-app-laravel:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS off;
    }

    location / {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;
        proxy_pass http://nginx-docker-app-front:3000;
        proxy_redirect off;
    }
}

# Dedicated backend server for Laravel (development)
server {
    listen 8080;
    server_name localhost 127.0.0.1;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass nginx-docker-app-laravel:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS off;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|woff2?|ttf)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=3600";
    }
}

server {
    listen 443 ssl ;
    server_name fastservicetravel.com www.fastservicetravel.com;

    ssl_certificate /etc/ssl/certs/fastservicetravel.com.chained.crt;
    ssl_certificate_key /etc/ssl/certs/bdbef938ffde618d.key;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';

    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/css application/javascript application/json application/font-woff application/font-tff image/gif image/png image/svg+xml application/octet-stream;

    client_max_body_size 100M;

    root /var/www/html/public;
    index index.php;
    charset utf-8;


    # Block Lighthouse and PageSpeed Insights
    if ($http_user_agent ~* "Lighthouse|Chrome-Lighthouse|PageSpeed|Google Page Speed Insights") {
        return 403;
    }

    location /storage {
        return 301 /admin/storage;
    }

    location /admin/storage/ {
        alias /var/www/html/storage/app/public/;
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
        try_files $uri $uri/ =404;
    }

    location /admin {
        return 301 /admin/home;
    }

    location /admin/ {
        try_files $uri $uri/ /index.php?$query_string;
    }


    location /login {
        try_files $uri $uri/ /index.php?$query_string;
    }

    
    location /logout {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /register {
        try_files $uri $uri/ /index.php?$query_string;
    }

    
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_read_timeout 3000;
        fastcgi_max_temp_file_size 0;
        fastcgi_buffer_size 4K;
        fastcgi_buffers 64 4k;
        proxy_connect_timeout 1000;
        proxy_send_timeout 1000;
        proxy_read_timeout 1000;
        send_timeout 1000;
        fastcgi_pass nginx-docker-app-laravel:9000;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param HTTPS on;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location / {

        # root /var/www/front/public;
        # index index.html;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;
        # try_files $uri $uri/ /index.html;


        proxy_pass http://nginx-docker-app-front:3000;
        proxy_redirect off;
    }
}