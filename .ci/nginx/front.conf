server {
  listen 3000;

  gzip on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_types text/css application/javascript application/json application/font-woff application/font-tff image/gif image/png image/svg+xml application/octet-stream;

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri $uri/ /index.html =404;

    location ~* \.(gif|jpe?g|png|webp|ico|svg|css|js|mp4)$ {
      expires 1M;
    }
  }

  # Proxy API calls to the backend nginx which serves Laravel
  location /api/ {
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_set_header X-NginX-Proxy true;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    client_max_body_size 100M;

    # Proxy directly to backend HTTPS to avoid 301 redirect from port 80
    proxy_ssl_server_name on;
    proxy_ssl_verify off; # internal network, self-signed/alt-name
    proxy_pass https://nginx-docker-app-nginx;
  }
}